plugins {
    id 'java'
    // The following line allows to load io.gatling.gradle plugin and directly apply it
    id 'io.gatling.gradle' version '3.15.1.3'
}

// Pinned so runs do not silently inherit whatever JDK happens to be on the machine.
// A different JDK changes GC behaviour and JIT, which is exactly what we are trying to measure.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

gatling {
  // Logging is configured in src/gatling/resources/logback-test.xml. The plugin's logLevel and
  // logHttp options were removed after 3.9, and were already inert here anyway - they only applied
  // when no logback config was present.
  enterprise {
    // Enterprise Cloud (https://cloud.gatling.io/) configuration reference: https://gatling.io/docs/gatling/reference/current/extensions/gradle_plugin/#working-with-gatling-enterprise-cloud
    // Enterprise Self-Hosted configuration reference: https://gatling.io/docs/gatling/reference/current/extensions/gradle_plugin/#working-with-gatling-enterprise-self-hosted
  }
}

repositories {
  mavenCentral()
}


configurations.gatling {
    // The AWS SDK drags in netty-nio-client, whose netty-codec 4.1.x has no 4.2 counterpart for
    // Gradle to upgrade - Netty 4.2 split that module into netty-codec-base and
    // netty-codec-compression. The stale jar then shadows ZlibCodecFactory, Gatling 3.15's gzip
    // decoder fails to construct, and every request hangs with the connection open and nothing sent.
    // Only the synchronous Cognito client is used here, so the async transport can go entirely.
    exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    exclude group: 'io.netty', module: 'netty-codec'
}

dependencies {
    gatling platform('software.amazon.awssdk:bom:2.20.26')
    gatling 'software.amazon.awssdk:regions'
    gatling 'software.amazon.awssdk:cognitoidentity'
    gatling 'software.amazon.awssdk:cognitoidentityprovider'

}

// Unit tests for the simulation's pure logic, in their own source set.
//
// Not `src/test/java`: the Gatling plugin puts the test source set's output on the *gatling*
// compile classpath, so a test that also needs the gatling classes makes the two circular. A
// separate source set sidesteps that without reconfiguring the plugin.
//
// Only what can be tested without an injector is covered: the push distribution's maths and
// validation (D8.9), and page-metadata parsing (D8.8). Anything needing a running scenario is
// covered by `make smoke_closed_port` instead.
sourceSets {
    unitTest {
        java.srcDirs = ['src/unitTest/java']
        compileClasspath += sourceSets.gatling.output + configurations.gatlingCompileClasspath
        runtimeClasspath += sourceSets.gatling.output + configurations.gatlingRuntimeClasspath
    }
}

dependencies {
    unitTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    unitTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('unitTest', Test) {
    description = 'Runs the simulation unit tests.'
    group = 'verification'
    testClassesDirs = sourceSets.unitTest.output.classesDirs
    classpath = sourceSets.unitTest.runtimeClasspath
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped' }
}

tasks.named('check') { dependsOn 'unitTest' }

// A11. A simulation.log without provenance is not comparable to anything. This records what produced
// each run, next to the run itself, so a result found months later can still be placed.
//
// Two fields cannot be discovered and must be supplied: the server build (the server exposes only
// /ping, which returns "pong") and the dataset identity. Both are recorded as "unrecorded" when
// absent rather than silently omitted, so their absence is visible in the archive.
def gitOutput = { String... args ->
    try {
        def out = new ByteArrayOutputStream()
        exec { commandLine args; standardOutput = out; errorOutput = new ByteArrayOutputStream() }
        return out.toString().trim()
    } catch (Exception ignored) {
        return "unknown"
    }
}

tasks.register('archiveRun') {
    doLast {
        def reportsRoot = file("$buildDir/reports/gatling")
        def latest = reportsRoot.listFiles()?.findAll { it.directory }?.max { it.lastModified() }
        if (latest == null) {
            logger.lifecycle("archiveRun: no gatling report directory found, nothing to record")
            return
        }
        def prop = { String name, Object fallback -> System.getProperty(name) ?: fallback }

        // **The harness does not always run from a git checkout.** avni-infra's
        // roles/avni_injector delivers it to the injector as a `git archive`
        // tarball of one commit, deliberately: the host is disposable and
        // recreated on every apply, so it must never hold a deploy key for this
        // private repo. `git archive` strips .git.
        //
        // In that situation `git rev-parse` fails, gitOutput returns the string
        // "unknown", and the dirty check then reads that non-empty string as
        // "the working tree has uncommitted changes" -- a false positive stacked
        // on top of a missing value. The 2026-10-05 case 1 run recorded
        // gitSha=unknown with gitDirty=true and warned it could not be
        // reproduced, when in fact it ran a clean f76d110.
        //
        // So: let the caller supply what git cannot see, and only fall back to
        // git when git is actually there.
        //
        //   ./gradlew gatlingRun -DSIMULATION_SHA=$(cat .harness-sha)
        def gitStatusOut = gitOutput('git', 'status', '--porcelain')
        def gitAvailable = gitStatusOut != 'unknown'
        def entityTable = new groovy.json.JsonSlurper().parse(
            file("src/gatling/resources/avni-entities.json"))
        def entities = entityTable.entities

        // What the run resolved to is read from the simulation rather than restated here. The
        // previous version kept its own copy of the property list and drifted out of date -- it
        // recorded MAX_REALM_STORAGE_PAUSE long after that property was removed, and knew nothing
        // of push, media, co-tenants or injection profiles. This file records what *produced* the
        // run; the simulation records what it *ran with*.
        def settingsFile = file(prop('RUN_SETTINGS_FILE', "$buildDir/last-run-settings.json"))
        def settings = settingsFile.exists()
            ? new groovy.json.JsonSlurper().parse(settingsFile)
            : 'unrecorded - the simulation did not write one'

        def metadata = [
            runId     : latest.name,
            recordedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX"),
            simulation: [
                gitSha        : prop('SIMULATION_SHA', gitOutput('git', 'rev-parse', 'HEAD')),
                // Only git can tell whether a checkout is dirty. Without one, an
                // archive of a named commit is by definition not dirty, so the
                // default is false rather than a guess -- overridable for the
                // case where someone archives a tree they had edited.
                gitDirty      : gitAvailable
                    ? !gitStatusOut.isEmpty()
                    : Boolean.parseBoolean(prop('SIMULATION_DIRTY', 'false').toString()),
                gatlingPlugin : '3.15.1.3'
            ],
            target    : [
                // Read from the simulation's own record. Restating the default here meant two
                // copies of one value, and a rename that touched only one would have archived a
                // hostname the run never used.
                baseUrl    : (settings instanceof Map && settings.baseUrl)
                    ? settings.baseUrl
                    : prop('BASE_URL', 'unrecorded - the simulation did not write one'),
                serverBuild: prop('SERVER_BUILD', 'unrecorded')
            ],
            settings  : settings,
            entityTable: [
                source: entityTable._source,
                total : entities.size(),
                pulled: entities.count { it.pullRequired }
            ],
            dataset   : prop('DATASET_ID', 'unrecorded'),
            // G2 and G3 each come down to one decision that changes how a result reads, and
            // neither is visible in the run otherwise. A cold database measures its disks and a
            // warm one measures the server; autovacuum on is realistic and a known source of
            // run-to-run variance. Recorded so two runs cannot be compared without it showing.
            environment: [
                cachePolicy: prop('CACHE_POLICY', 'unrecorded'),
                autovacuum : prop('AUTOVACUUM', 'unrecorded')
            ]
        ]

        def target = new File(latest, "run-metadata.json")
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + "\n"
        logger.lifecycle("archiveRun: wrote ${target}")
        if (metadata.simulation.gitDirty) {
            logger.lifecycle("archiveRun: WARNING - working tree is dirty, so this run cannot be "
                + "reproduced from ${metadata.simulation.gitSha} alone")
        }
        // **Fixing the false gitDirty removed the only signal this case had.** Before the archive
        // case was handled, a run with no .git recorded gitSha=unknown *and* gitDirty=true, and the
        // warning above is how the first run's missing provenance got noticed at all. With dirty
        // correctly false, an unknown sha now passes in silence -- a run that cannot be traced to
        // the code that produced it, and nothing says so. The sha needs its own check.
        if (metadata.simulation.gitSha == 'unknown') {
            logger.lifecycle("archiveRun: WARNING - no harness commit recorded, so this run cannot "
                + "be traced to the code that produced it. On an injector the tarball carries no "
                + ".git: pass -DSIMULATION_SHA=\$(cat .harness-sha)")
        }
        def unrecorded = [
            'DATASET_ID'  : metadata.dataset,
            'SERVER_BUILD': metadata.target.serverBuild,
            'CACHE_POLICY': metadata.environment.cachePolicy,
            'AUTOVACUUM'  : metadata.environment.autovacuum
        ].findAll { it.value == 'unrecorded' }.keySet()
        if (unrecorded) {
            logger.lifecycle("archiveRun: NOTE - pass " + unrecorded.collect { "-D$it" }.join(' ')
                + " to make this run comparable with others")
        }
        if (settings instanceof String) {
            logger.lifecycle("archiveRun: WARNING - no run settings found at ${settingsFile}. The "
                + "archive records what produced this run but not what it ran with, so it cannot "
                + "be compared with another run or reproduced.")
        } else {
            // Consumed, so a later archiveRun cannot silently attach a previous run's settings.
            settingsFile.delete()
            logger.lifecycle("archiveRun: injector ${settings.injector?.label}, "
                + "profile ${settings.injection?.profile}, push ${settings.push?.enabled}, "
                + "co-tenants ${settings.coTenants?.enabled}")
        }
    }
}

tasks.matching { it.name == 'gatlingRun' }.configureEach { finalizedBy 'archiveRun' }
